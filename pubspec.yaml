name: syncro_kiosk
description: "Syncro Kiosk: shared employee self-service tablet for Syncro Connect."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  package_info_plus: ^9.0.0
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app-icon.png
